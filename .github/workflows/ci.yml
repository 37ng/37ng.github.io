name: CI

# Runs on every push and PR, and on tags — so a release tag proves the same
# things a normal push does before it becomes a release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      # `npm ci` is the lockfile check: it installs strictly from
      # package-lock.json and fails outright if the lock has drifted from
      # package.json, rather than silently repairing it the way `npm install`
      # would. That is the whole reason CI uses it.
      - name: Install dependencies
        run: npm ci

      - name: Types
        run: npm run check

      - name: Build
        run: npm run build
